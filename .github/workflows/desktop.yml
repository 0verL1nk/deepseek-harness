# Build the Electron distribution on the operating system it targets. A local
# package check runs for every pull request; signed installers and archives
# publish only from a desktop release tag. The desktop application carries its
# own version line (vX.Y.Z); the bundled dsh core keeps the workspace
# version.
name: Desktop

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'tsdown.config.ts'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Desktop package check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build desktop inputs
        run: pnpm run build
      - name: Verify Electron package configuration
        run: pnpm run desktop:verify
      - name: Package Linux application directory
        run: pnpm run desktop:package

      - name: Boot the packaged backend
        run: pnpm --filter @deepseek-ai/dsh-desktop run boot-smoke

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            electron_args: --mac --arm64 --publish never
          - name: macOS x64
            runner: macos-14
            electron_args: --mac --x64 --publish never
          - name: Windows x64
            runner: windows-2025
            electron_args: --win --x64 --publish never
          - name: Linux x64
            runner: ubuntu-24.04
            electron_args: --linux --x64 --publish never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Restore Electron cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: desktop-${{ runner.os }}-${{ matrix.name }}-
      - name: Restore Electron cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: desktop-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: desktop-${{ runner.os }}-${{ matrix.name }}-
      - name: Install MSVC Spectre libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installationPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify --installPath $installationPath --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --wait --norestart
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build desktop inputs
        run: pnpm run build
      - name: Resolve desktop release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" node -e "if (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/.test(process.env.VERSION)) process.exitCode = 1"
          echo "DESKTOP_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify Electron package configuration
        run: pnpm run desktop:verify
      - name: Configure macOS signing
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          DESKTOP_CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          DESKTOP_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          DESKTOP_APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          DESKTOP_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          DESKTOP_APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          # Do not export empty CSC_LINK: electron-builder treats even an empty
          # value as a certificate path and attempts to sign the app directory.
          if [[ -z "$DESKTOP_CSC_LINK" ]]; then
            exit 0
          fi
          {
            echo "CSC_LINK=$DESKTOP_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$DESKTOP_CSC_KEY_PASSWORD"
            echo "APPLE_ID=$DESKTOP_APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$DESKTOP_APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$DESKTOP_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Build native distributables
        env:
          DESKTOP_RELEASE_OWNER: ${{ github.repository_owner }}
          DESKTOP_RELEASE_REPOSITORY: ${{ github.event.repository.name }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --config electron-builder.config.mjs ${{ matrix.electron_args }}
      - name: Report distributable sizes
        shell: pwsh
        run: Get-ChildItem apps/desktop/dist -File | Sort-Object Length -Descending | Select-Object Name, @{ Name = 'MiB'; Expression = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      # Prove this platform's pruned dependency set starts the web host
      # before the artifacts are published as updatable releases.
      - name: Boot the packaged backend
        run: pnpm --filter @deepseek-ai/dsh-desktop run boot-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.name }}
          # Distributables and updater metadata only: the per-platform
          # unpacked directories and builder-debug.yml are build scaffolding,
          # and the release upload reads plain files, not directories.
          path: |
            apps/desktop/dist/*
            !apps/desktop/dist/linux-unpacked
            !apps/desktop/dist/win-unpacked
            !apps/desktop/dist/mac
            !apps/desktop/dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish desktop release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: dist/desktop
          merge-multiple: true
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-desktop-release.sh
